[global]
; supervisord owns the process, so php-fpm must stay in the foreground.
daemonize = no
error_log = /proc/self/fd/2

[www]
listen = 127.0.0.1:9000
user = www-data
group = www-data

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

; Without this, php-fpm scrubs the container environment and Laravel sees no
; APP_KEY / SUPABASE_* variables.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no

access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

request_terminate_timeout = 65s
